<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Campagne AcquaPark — Acqua1Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #ffffff; }
body { font-family: 'DM Sans', Arial, sans-serif; color: #0A1628; }

.tabbar {
  position: sticky; top: 0; z-index: 20;
  background: #0A1628;
  padding: 16px 40px 14px;
  display: flex; gap: 10px; justify-content: center; align-items: center;
  border-bottom: 1px solid #1E3350;
}
.chip {
  font-family: 'DM Sans', Arial, sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
  padding: 9px 26px; border-radius: 24px;
  border: 1.5px solid #2A4A66; background: transparent; color: #8FA8C0;
  cursor: pointer; transition: all .15s ease;
}
.chip:hover { color: #ffffff; border-color: #5BB8D4; }
.chip.active { background: #5BB8D4; border-color: #5BB8D4; color: #0A1628; }

.frame-wrap { width: 100%; }
iframe { width: 100%; border: none; display: block; }
iframe.hidden { display: none; }
</style>
</head>
<body>

<div class="tabbar">
  <button class="chip active" data-target="meta" id="chip-meta">Meta</button>
  <button class="chip" data-target="google" id="chip-google">Google</button>
</div>

<div class="frame-wrap">
  <iframe id="frame-meta" src="meta.html" title="Report Meta Ads" scrolling="no"></iframe>
  <iframe id="frame-google" src="google.html" title="Report Google Ads" class="hidden" scrolling="no"></iframe>
</div>

<script>
(function () {
  var frames = { meta: document.getElementById('frame-meta'), google: document.getElementById('frame-google') };
  var chips  = { meta: document.getElementById('chip-meta'),  google: document.getElementById('chip-google') };

  function fit(f) {
    try {
      var doc = f.contentWindow.document;
      f.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
    } catch (e) {}
  }

  Object.keys(frames).forEach(function (k) {
    frames[k].addEventListener('load', function () { fit(frames[k]); });
  });

  function show(target) {
    Object.keys(frames).forEach(function (k) {
      var on = (k === target);
      frames[k].classList.toggle('hidden', !on);
      chips[k].classList.toggle('active', on);
      if (on) { fit(frames[k]); }
    });
    try { localStorage.setItem('ap_report_tab', target); } catch (e) {}
    window.scrollTo(0, 0);
  }

  Object.keys(chips).forEach(function (k) {
    chips[k].addEventListener('click', function () { show(k); });
  });

  // re-fit on resize (layout can reflow at breakpoints)
  window.addEventListener('resize', function () {
    Object.keys(frames).forEach(function (k) {
      if (!frames[k].classList.contains('hidden')) { fit(frames[k]); }
    });
  });

  // restore last selected tab
  var saved = 'meta';
  try { saved = localStorage.getItem('ap_report_tab') || 'meta'; } catch (e) {}
  if (saved !== 'meta' && saved !== 'google') { saved = 'meta'; }
  show(saved);
})();
</script>

</body>
</html>
