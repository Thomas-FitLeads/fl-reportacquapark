      &lt;h3&gt;Lettura&lt;/h3&gt;
      &lt;p&gt;Nella stagione 2026 abbiamo investito &lt;strong&gt;€10.593,30&lt;/strong&gt; in advertising e le piattaforme hanno attribuito &lt;strong&gt;€65.722,60&lt;/strong&gt; di vendite di biglietti online, con &lt;strong&gt;1.486 acquisti&lt;/strong&gt;: ogni euro investito ha generato in media &lt;strong&gt;€6,20&lt;/strong&gt; di valore.&lt;/p&gt;
      &lt;p&gt;I due canali hanno avuto ruoli diversi. &lt;strong&gt;Meta&lt;/strong&gt; ha fatto conoscere il parco e le sue novità a un pubblico ampio e ha costruito la domanda, con campagne di vendita, raccolta contatti e notorietà. &lt;strong&gt;Google&lt;/strong&gt; ha raccolto quella domanda nel momento della ricerca, con un ROAS di 8,21x. Lo scontrino medio quasi identico sui due canali (€43,59 e €44,84) indica che i due canali hanno venduto biglietti di valore simile.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

    &lt;div class=&quot;reading&quot;&gt;
      &lt;h3&gt;Lettura dell&#x27;andamento&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;Maggio&lt;/strong&gt; è stato dedicato alla pre-stagione: raccolta contatti per le feste di compleanno e per la prevendita, senza campagne di vendita attive. A &lt;strong&gt;giugno&lt;/strong&gt; partono le vendite: il primo mese chiude con ROAS 5,23x, mentre campagne e creatività trovano il loro assetto.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Luglio&lt;/strong&gt; è il cuore della stagione: il mese di maggior investimento (€4.293) e di maggior valore (€31.075), con ROAS salito a &lt;strong&gt;7,24x&lt;/strong&gt;. &lt;strong&gt;Agosto&lt;/strong&gt; mantiene quasi la stessa resa (7,14x) con il 35% di investimento in meno: la macchina è diventata più efficiente man mano che la stagione avanzava.&lt;/p&gt;

&lt;section style=&quot;background:linear-gradient(180deg,#E6EEF4,#EEF3F7)&quot;&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Evoluzione della stagione&lt;/p&gt;
    &lt;h2&gt;Come sono cambiate le campagne&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;Cosa abbiamo osservato nei report durante la stagione, cosa abbiamo deciso e cosa è successo dopo, verificato con i dati finali.&lt;/p&gt;
    &lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;ul class=&quot;tl&quot;&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;Maggio&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Pre-stagione: feste di compleanno e prevendita&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Lancio delle campagne Bday AP (13 maggio) e Pre Sale (18 maggio) per raccogliere contatti prima dell&#x27;apertura.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;90 registrazioni per le feste a €10,77 l&#x27;una, di cui 89 tra maggio e giugno, più 36 acquisti diretti.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;1 giugno&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Partono le vendite su Meta&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Lancio di AP Ticket con le prime creatività (All, TOF, TOF V2, Mockup).&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;Metà giugno&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Lancio di AP Novità e della campagna Google&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Il 16 giugno parte AP Novità, dedicata alle novità 2026 del parco. Dal 15 giugno è attiva la campagna Google Search con strategia ROAS target.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;Google a regime già dalla seconda settimana: 10,60x nella settimana 22–28 giugno.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li class=&quot;rep&quot;&gt;&lt;div class=&quot;when&quot;&gt;Report del 25 giugno&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;AP Ticket in difficoltà&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Nella settimana 16–22 giugno AP Ticket scende a ROAS 1,18 con costo per acquisto triplicato: pubblico in saturazione. Il creativo 22.06 TOF V1 mostra il ROAS più alto dell&#x27;account.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl dec&quot;&gt;Deciso&lt;/span&gt;Rinnovare pubblico e creatività prima di aumentare il budget, e puntare su TOF V1.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;Il nuovo 25.06 Video TOF V2 chiude la stagione con 96 acquisti e ROAS 6,55. TOF V1 chiude a ROAS 10,45. AP Ticket passa da 4,46 a giugno a 5,53 a luglio.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;10 luglio&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Pausa del gruppo Generico su Google&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Il gruppo con le ricerche generiche rende meno della metà dei gruppi Geo Localizzato e Brand: ROAS 4,62x a giugno contro 9,62x di Geo.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl dec&quot;&gt;Deciso&lt;/span&gt;Mettere in pausa il gruppo Acquisto Biglietti Generico e concentrare il budget su Geo Localizzato e Brand.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;Luglio chiude a ROAS 8,29x, il miglior mese di Google, con un investimento due volte e mezzo quello di giugno.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;15 luglio&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Nuovo video principale su AP Ticket&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Lancio del 15.07 Video TOF V4 Copy 2.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;Diventa la creatività più importante della stagione: €1.217 di spesa, 158 acquisti, ROAS 5,62.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;20–26 luglio&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;La settimana più competitiva&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Su Google il 44% delle impressioni va perso per ranking, con acquaticapark.it più aggressivo in asta: ROAS settimanale 5,39x, il più basso della stagione.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;27 luglio&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Nuova creatività su AP Novità&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Lancio del 27.07 AP Novità New 2.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;È l&#x27;annuncio più efficiente dell&#x27;anno: 81 acquisti con €258 di spesa, ROAS 13,80.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li class=&quot;rep&quot;&gt;&lt;div class=&quot;when&quot;&gt;Report del 12 agosto&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Google: calo fisiologico e ripresa&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Nel periodo 29 giugno–2 agosto il calo di metà luglio è legato alla competizione. Nell&#x27;ultima settimana la quota impressioni sale al 45%.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl dec&quot;&gt;Deciso&lt;/span&gt;Mantenere la strategia tROAS, continuare a escludere le ricerche non pertinenti e monitorare i competitor.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;Nelle prime due settimane di agosto la quota persa per ranking scende sotto il 10% e la quota impressioni arriva al 60%. La settimana 10–16 agosto chiude a 10,12x con 120 acquisti.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;11 agosto&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Rotazione creativa su AP Ticket&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Lancio del nuovo 11.08 Video TOF V5 Copy 3, per dare il cambio al V4 Copy 2 attivo dal 15 luglio.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li class=&quot;rep&quot;&gt;&lt;div class=&quot;when&quot;&gt;Report del 19 agosto&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Efficienza ai massimi di stagione&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;Nella settimana 13–19 agosto il V5 Copy 3 diventa il motore di AP Ticket. AP Novità tocca ROAS 15,11 con i primi segnali di saturazione del pubblico.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;lbl res&quot;&gt;Risultato&lt;/span&gt;Agosto è il miglior mese sia per AP Ticket (5,79) sia per AP Novità (10,32). Il V5 Copy 3 chiude a ROAS 6,75.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;li&gt;&lt;div class=&quot;when&quot;&gt;Fine agosto&lt;/div&gt;&lt;div class=&quot;what&quot;&gt;Chiusura della stagione di vendita online&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;span class=&quot;lbl obs&quot;&gt;Osservato&lt;/span&gt;La campagna Google si ferma il 19 agosto, le campagne di vendita Meta chiudono entro fine mese. Ad agosto è attiva anche la promozione delle Giornate di Animazione, con 1.992 visite al profilo.&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;p class=&quot;footnote&quot;&gt;I valori di Google citati nei report settimanali erano più bassi di quelli finali: Google Ads attribuisce una parte delle conversioni con alcuni giorni di ritardo.&lt;/p&gt;

      &lt;p&gt;La stagione 2026 chiude con &lt;strong&gt;€65.723&lt;/strong&gt; di valore attribuito su &lt;strong&gt;€10.593&lt;/strong&gt; investiti. Più del risultato finale conta la direzione: le campagne hanno reso di più mese dopo mese, e le decisioni prese nei report settimanali si ritrovano nei numeri.&lt;/p&gt;
      &lt;ul class=&quot;steps&quot;&gt;
        &lt;li&gt;&lt;b&gt;Partire con Meta e Google insieme&lt;/b&gt; dall&#x27;apertura delle vendite: Google ha reso sopra 8x fin dal primo mese.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Ripartire dal format Novità&lt;/b&gt;, il più efficiente della stagione, e verificare quanto regge con budget più alti.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Pianificare le creatività in anticipo&lt;/b&gt;, con una nuova creatività principale ogni 3-4 settimane.&lt;/li&gt;

        &lt;li&gt;&lt;b&gt;Preparare prima dell&#x27;avvio le esclusioni su Google&lt;/b&gt; per le ricerche generiche e i nomi di altri parchi.&lt;/li&gt;

  .delta{font-weight:700; font-size:14px; white-space:nowrap}
  .up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--neutral)}
  .hero-row td{background:#F2FBFC !important}
  .hero-row td:first-child{color:var(--ink); font-weight:700}
  .footnote{font-size:12.5px; color:var(--muted); margin-top:12px; font-style:italic}
  .chart-card{padding:22px 22px 10px; margin-bottom:22px}
  .chart-card svg{width:100%; height:auto; display:block}
  .legend{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:6px}
  .legend-item{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); font-weight:600}
  .legend-dot{width:10px; height:10px; border-radius:50%; display:inline-block}

  /* ---------- Reading ---------- */
  .reading{margin-top:22px}
  .reading h3{
    font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--aqua2);
    font-weight:700; margin:0 0 10px;
  }
  .reading p{margin:0 0 12px; color:#2B3B4A; font-size:15.5px}
  .reading p:last-child{margin-bottom:0}
  .reading strong{color:var(--ink); font-weight:700}

  /* ---------- Performance cards ---------- */
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
  .pcard{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px;
    box-shadow:0 8px 24px rgba(10,37,64,.05); position:relative; display:flex; flex-direction:column;
  }
  .pcard.top{border-color:#F0D98B; box-shadow:0 8px 28px rgba(201,151,0,.14)}
  .pcard.paused{opacity:.82}
  .rank{
    display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; color:var(--aqua2);
    background:#E9F6FA; padding:5px 11px; border-radius:999px; align-self:flex-start; margin-bottom:14px;
  }
  .pcard.top .rank{color:var(--gold); background:var(--gold-bg)}
  .pcard h4{font-size:16px; font-weight:700; margin:0 0 2px; letter-spacing:-.01em}
  .pcard .grp-sub{font-size:13px; color:var(--muted); margin:0 0 16px}
  .mini-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:2px}
  .mini-table th{text-align:right; color:var(--muted); font-weight:600; padding:5px 3px; border-bottom:1px solid var(--line); font-size:9.5px; text-transform:uppercase; letter-spacing:.02em}
  .mini-table th:first-child{text-align:left}
  .mini-table td{text-align:right; padding:6px 3px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink)}
  .mini-table td:first-child{text-align:left; color:var(--muted); font-weight:600}
  .mini-table tr:last-child td{border-bottom:none}
  .pcard .trend{margin-top:16px; padding-top:14px; border-top:1px solid var(--line); font-size:13.5px; color:#2B3B4A}
  .pcard .trend b{color:var(--pos); font-weight:700}
  .pcard.paused .trend b{color:var(--neg)}

  /* ---------- Final notes ---------- */
  .notes .card{padding:30px}
  .notes p{margin:0 0 14px; font-size:15.5px; color:#2B3B4A}
  .notes p:last-child{margin-bottom:0}
  .notes strong{color:var(--ink)}
  .steps{list-style:none; margin:22px 0 0; padding:20px 0 0; border-top:1px solid var(--line)}
  .steps li{position:relative; padding-left:30px; margin-bottom:12px; font-size:15px; color:#2B3B4A}
  .steps li:last-child{margin-bottom:0}
  .steps li::before{
    content:&quot;&quot;; position:absolute; left:0; top:8px; width:14px; height:14px; border-radius:4px;
    background:linear-gradient(135deg,var(--aqua),var(--teal));
  }
  .steps b{color:var(--ink)}

  /* ---------- Footer ---------- */
  footer{padding:34px 0 48px; text-align:center; color:var(--muted); font-size:13px}
  footer .rule{height:1px; background:var(--line); max-width:960px; margin:0 auto 24px}

  @media (max-width:760px){
    header{padding:40px 0 36px}
    header h1{font-size:29px}
    .cards{grid-template-columns:1fr}
    section{padding:34px 0}
    h2{font-size:22px}
    thead th,tbody td{padding:11px 14px; font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media print{
    body{background:#fff}
    header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .card,.pcard{box-shadow:none}
    section{padding:24px 0}
  }

    &lt;div class=&quot;reading&quot;&gt;
      &lt;h3&gt;Lettura dell&#x27;andamento&lt;/h3&gt;
      &lt;p&gt;Dopo la settimana di avvio, la campagna entra subito a regime: &lt;strong&gt;10,60x e 10,47x&lt;/strong&gt; nelle due settimane a cavallo tra giugno e luglio. A metà luglio la competizione in asta cresce e la quota di impressioni persa per ranking sale fino al &lt;strong&gt;43,55%&lt;/strong&gt; nella settimana del 20–26 luglio, la più debole della stagione (ROAS 5,39x), in coincidenza con la maggiore pressione di acquaticapark.it.&lt;/p&gt;
      &lt;p&gt;Da fine luglio la situazione si ribalta: la quota persa per ranking scende sotto il 10% nelle prime due settimane di agosto e la settimana del 10–16 agosto chiude a &lt;strong&gt;10,12x con 120 acquisti&lt;/strong&gt;, il miglior risultato settimanale in volume. Gli ultimi tre giorni di attività (17–19 agosto) chiudono la stagione con volumi bassi.&lt;/p&gt;
      &lt;p&gt;Nota sui valori: Google Ads attribuisce una parte delle conversioni con alcuni giorni di ritardo. Per questo il valore delle settimane di luglio oggi è più alto di quanto riportato nel report del 12 agosto, ad esempio €4.071 invece di €3.528 per la settimana 27 luglio–2 agosto.&lt;/p&gt;

    &lt;div class=&quot;reading&quot;&gt;
      &lt;h3&gt;Lettura&lt;/h3&gt;
      &lt;p&gt;Le prime 10 ricerche generano &lt;strong&gt;quasi l&#x27;80% degli acquisti&lt;/strong&gt; attribuiti ai termini di ricerca e sono quasi tutte ricerche del parco o della località: &quot;piscina castano primo&quot;, &quot;acquapark castano primo&quot;, &quot;acqua village&quot;. Google ha intercettato con grande efficienza chi stava già cercando AcquaPark, con un costo per acquisto tra €2,80 e €7,20.&lt;/p&gt;
      &lt;p&gt;Le ricerche generiche (&quot;acquapark milano&quot;, &quot;biglietti&quot;, &quot;prezzi&quot;) e quelle con i nomi di altri parchi (Aquaneva, Ondaland, Ondasplash, Acquatica) hanno portato pochi o nessun acquisto. Nella stagione circa &lt;strong&gt;€440&lt;/strong&gt; sono andati su ricerche senza conversioni: una lista di esclusioni pronta dal primo giorno li recupera nel 2027.&lt;/p&gt;
      &lt;p&gt;Per questo Google e Meta lavorano in modo complementare: Meta crea la domanda raggiungendo chi non conosce ancora il parco, Google la raccoglie quando la persona lo cerca.&lt;/p&gt;

    &lt;h2&gt;Considerazioni di fine stagione&lt;/h2&gt;
    &lt;div class=&quot;card&quot; style=&quot;margin-top:18px&quot;&gt;
      &lt;p&gt;La campagna Search chiude la stagione con &lt;strong&gt;ROAS 8,21x&lt;/strong&gt; e €34.034,45 di valore su €4.143,90 investiti. La strategia ROAS target ha tenuto la resa mensile sopra l&#x27;obiettivo in tutti e tre i mesi.&lt;/p&gt;
      &lt;p&gt;Le due decisioni che hanno pesato di più: la &lt;strong&gt;pausa del gruppo Generico il 10 luglio&lt;/strong&gt;, che ha concentrato il budget sui gruppi con ROAS sopra 7x, e la scelta, confermata nel report del 12 agosto, di &lt;strong&gt;mantenere la strategia tROAS&lt;/strong&gt; anche dopo la settimana più debole. Ad agosto la quota impressioni è salita fino al 60% con il costo per acquisto più basso della stagione.&lt;/p&gt;
      &lt;ul class=&quot;steps&quot;&gt;
        &lt;li&gt;&lt;b&gt;Avviare la campagna insieme a Meta&lt;/b&gt; dall&#x27;apertura delle vendite: a giugno Google ha reso 8x fin dalla seconda settimana.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Caricare subito le esclusioni&lt;/b&gt; di ricerche generiche e nomi di altri parchi.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Concentrare il budget su Geo Localizzato e Brand&lt;/b&gt;, i due gruppi che hanno generato il 97% degli acquisti.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Monitorare acquaticapark.it da metà luglio&lt;/b&gt;, il periodo in cui la competizione in asta è stata più forte.&lt;/li&gt;
      &lt;/ul&gt;

<script>
(function () {
  var frames = { tot: document.getElementById('frame-tot'), meta: document.getElementById('frame-meta'), google: document.getElementById('frame-google') };
  var chips  = { tot: document.getElementById('chip-tot'), meta: document.getElementById('chip-meta'),  google: document.getElementById('chip-google') };

  function fit(f) {
    try {
      var doc = f.contentWindow.document;
      f.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
    } catch (e) {}
  }

  Object.keys(frames).forEach(function (k) {
    frames[k].addEventListener('load', function () { fit(frames[k]); });
  });

  function show(target) {
    Object.keys(frames).forEach(function (k) {
      var on = (k === target);
      frames[k].classList.toggle('hidden', !on);
      chips[k].classList.toggle('active', on);
      if (on) { fit(frames[k]); }
    });
    try { localStorage.setItem('ap_season_tab', target); } catch (e) {}
    window.scrollTo(0, 0);
  }

  Object.keys(chips).forEach(function (k) {
    chips[k].addEventListener('click', function () { show(k); });
  });

  // re-fit on resize (layout can reflow at breakpoints)
  window.addEventListener('resize', function () {
    Object.keys(frames).forEach(function (k) {
      if (!frames[k].classList.contains('hidden')) { fit(frames[k]); }
    });
  });

  // restore last selected tab
  var saved = 'tot';
  try { saved = localStorage.getItem('ap_season_tab') || 'tot'; } catch (e) {}
  if (['tot','meta','google'].indexOf(saved) < 0) { saved = 'tot'; }
  show(saved);
})();
</script>
